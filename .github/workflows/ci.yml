name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-service/requirements.txt

      - name: Run Pytest test suite
        run: |
          export PYTHONPATH="api-service"
          pytest api-service/tests/test_api.py -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Lint web application
        working-directory: web
        run: npm run lint

      - name: Build Next.js production bundle
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.nadirsaidi.dev"
